[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "yharness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dsh CLI runtime for the Y Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/tobenwarrior/y-harness"
Documentation = "https://github.com/tobenwarrior/y-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/tobenwarrior/y-harness/issues"
Source = "https://github.com/tobenwarrior/y-harness"

[project.scripts]
yharness = "yharness_runtime:main"
dsh = "yharness_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/yharness_runtime/runtime/yharness-sdk-runtime-*",
  "src/yharness_runtime/runtime/yharness-sdk-runtime-*/**",
  "src/yharness_runtime/runtime/linux-*/**",
  "src/yharness_runtime/runtime/macos-*/**",
  "src/yharness_runtime/runtime/win-*/**",
]
exclude = ["src/deepseek_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/yharness_runtime", "src/deepseek_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
