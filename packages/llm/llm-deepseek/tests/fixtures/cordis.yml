- name: '@yharness/llm'
- name: '@yharness/session'
- name: '@yharness/session-projection'
- name: '@yharness/system-prompt'
- name: '@yharness/tools'
- name: '@yharness/agent'
- name: '@yharness/agent-loop'
  config:
    agents: []
- name: '@yharness/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@yharness/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@yharness/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
