- name: '@yharness/session'
- name: '@yharness/system-prompt'
- name: '@yharness/tools'
- name: '@yharness/fs-local'
- name: '@yharness/tool-fs'
- name: '@yharness/session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- name: '@yharness/session-reference'
  config:
    maxReferenceBytes: 360
- name: './source-session.ts'
- name: '@yharness/spill-local'
  config:
    root: '{{spillRoot}}'
    cleanupPeriodDays: 0
