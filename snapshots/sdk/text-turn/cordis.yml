# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@yharness/skill-filesystem'
  config:
    includeDefaultRoots: false

# Keep this recorded composition's permission defaults aligned with its committed
# session log; the shipped base may choose a different fresh-session preset.
- id: permission
  name: '@yharness/permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# The text-turn corpus predates bundled Compound skills and records no catalog
# message. Keep the skill tool schema while making this composition catalog-free.
- id: skill-compound
  disabled: true

- id: tool-skill
  name: '@yharness/tool-skill'
  config:
    catalogMode: all

- id: llm-deepseek
  name: '@yharness/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@yharness/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@yharness/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: snapshot-message-feedback
      name: '@yharness/message-feedback'
      disabled: !!js "process.env.DSH_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.DSH_SNAPSHOT_FEEDBACK !== '1'"
