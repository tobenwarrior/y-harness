# Keyless replay composition for the shared Bot connected-app Always allow snapshot owner.

- id: web

- insert:
    - id: connection
      name: '@yharness/client-connection'

- id: headless-runner
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: bot-session-sender
    json: !!js ctx.headlessStartup.json

- insert:
    - id: agent-bots
      name: '@yharness/bots'

- insert:
    - id: permission
      name: '@yharness/permission-presets'
      config:
        defaultPreset: approve-for-me
        presets:
          workspace-write:
            sandbox: workspace-write
            approval: ask
            name: workspace-write
            description: Write inside the workspace and permitted temporary directories; wider retries require approval.
          approve-for-me:
            sandbox: workspace-write
            approval: never
            name: approve-for-me
            description: Work freely inside the workspace without prompts; anything outside it is refused.
          danger-full-access:
            sandbox: danger-full-access
            approval: ask
            name: danger-full-access
            description: Full file access with approval prompts for sensitive actions.
    - id: approval
      name: '@yharness/user-approval'
      config:
        policy: ask
    - id: llm-replay
      name: '@yharness/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high
    - id: shared-bot-connected-app-approval-prereqs
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/shared-bot-connected-app-approval-prereqs.ts'

    - id: bots-snapshot
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/bot-snapshot.ts'

- id: llm-deepseek
  disabled: true
