# Live-recording patch shared by the ordinary headless snapshot composition.
# The shipped profile owns application startup; this patch fixes only the
# deterministic test composition and raw persistence needed for recording.

- id: llm-deepseek
  name: '@yharness/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro
      - id: deepseek-v4-flash-vision-exp
        inputModalities: [text, image]

# Keep this recorded composition's permission defaults aligned with its committed
# session log; the shipped base may choose a different fresh-session preset.
- id: permission
  name: '@yharness/permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# The text-turn corpus predates bundled Compound skills and records no catalog
# message. Keep the skill tool schema while making this composition catalog-free.
- id: skill-filesystem
  name: '@yharness/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: skill-compound
  disabled: true

- id: tool-skill
  name: '@yharness/tool-skill'
  config:
    catalogMode: all

- id: sandbox-policy
  name: '@yharness/sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? (process.env.DSH_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: !!js process.cwd()

- id: approval
  name: '@yharness/user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? (process.env.DSH_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')) === 'danger-full-access' ? 'never' : 'ask'"

- id: session-persistence-jsonl
  name: '@yharness/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: session-title-llm
  disabled: true

- id: system-prompt
  name: '@yharness/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: agent-instructions
  name: '@yharness/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-subagent
  name: '@yharness/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

- id: tool-subagent-fork
  name: '@yharness/tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: fs-sandbox
  name: '@yharness/fs-sandbox'
  config:
    cwd: !!js process.cwd()

- insert:
    - id: hooks-claude-code
      name: '@yharness/hooks-claude-code'
      config:
        configPath: ./hooks.json

    - id: hooks-codex
      name: '@yharness/hooks-codex'
      config:
        configPath: ./codex-hooks.json

- id: session-log-deepseek
  config:
    enabled: false
