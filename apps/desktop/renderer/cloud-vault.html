<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'">
    <title></title>
    <link rel="stylesheet" href="cloud-vault.css">
  </head>
  <body>
    <main hidden>
      <header class="heading">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5m-4 4v2"/></svg>
        </div>
        <div><h1 id="title"></h1><p id="hint"></p></div>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="request" hidden aria-labelledby="title">
        <dl class="request-target">
          <div><dt id="request-service-label"></dt><dd id="request-unit"></dd></div>
          <div><dt id="request-name-label"></dt><dd id="request-name"></dd></div>
        </dl>
        <form id="request-editor" autocomplete="off" hidden>
          <label for="request-value" id="request-value-label"></label>
          <input id="request-value" type="password" maxlength="8192" autocomplete="new-password" autocapitalize="off" spellcheck="false" required>
          <div class="actions">
            <button id="request-cancel" type="button"></button>
            <button id="request-save" class="primary" type="submit"></button>
          </div>
        </form>
        <p id="request-outcome" role="status" aria-live="polite"></p>
      </section>
      <section id="login-use" hidden aria-labelledby="title">
        <dl class="request-target">
          <div><dt id="login-use-origin-label"></dt><dd id="login-use-origin"></dd></div>
          <div><dt id="login-use-destination-label"></dt><dd id="login-use-destination"></dd></div>
        </dl>
        <div id="login-use-saved" hidden>
          <label for="login-choice" id="login-use-login-label"></label>
          <select id="login-choice"></select>
        </div>
        <p id="login-use-empty" class="empty" hidden></p>
        <form id="login-use-entry" autocomplete="off" hidden>
          <label for="login-use-username" id="login-use-username-label"></label>
          <input id="login-use-username" type="text" maxlength="512" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          <label for="login-use-password" id="login-use-password-label"></label>
          <input id="login-use-password" type="password" maxlength="8192" autocomplete="new-password" autocapitalize="off" spellcheck="false" required>
          <label for="login-use-code" id="login-use-code-label" hidden></label>
          <input id="login-use-code" type="password" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
          <label id="login-use-save-toggle" class="check-option">
            <input id="login-use-save" type="checkbox">
            <span id="login-use-save-text"></span>
          </label>
          <label for="login-use-save-label" id="login-use-save-label-text" hidden></label>
          <input id="login-use-save-label" type="text" maxlength="80" autocomplete="off" spellcheck="false" hidden>
        </form>
        <button id="login-use-toggle" class="subtle" type="button" hidden></button>
        <p id="login-use-outcome" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="login-use-decline" type="button"></button>
          <button id="login-use-approve" class="primary" type="button" hidden></button>
          <button id="login-use-submit" class="primary" form="login-use-entry" type="submit" hidden></button>
          <button id="login-use-close" class="primary" type="button" hidden></button>
        </div>
      </section>
      <div id="management" hidden>
        <nav class="segments" role="tablist" aria-labelledby="title">
          <button id="api-keys-tab" type="button" role="tab" aria-controls="api-keys-panel" aria-selected="true"></button>
          <button id="bot-access-tab" type="button" role="tab" aria-controls="bot-access-panel" aria-selected="false" tabindex="-1"></button>
          <button id="websites-tab" type="button" role="tab" aria-controls="websites-panel" aria-selected="false" tabindex="-1"></button>
        </nav>
        <section id="bot-access-panel" role="tabpanel" aria-labelledby="bot-access-tab" hidden>
          <p id="grants-hint" class="panel-hint"></p>
          <div class="list-title">
            <h2 id="grants-title"></h2>
            <button id="add-grant" class="subtle" type="button" disabled>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11m-5.5-5.5h11"/></svg><span id="add-grant-label"></span>
            </button>
          </div>
          <p id="grants-empty" class="empty" hidden></p>
          <ul id="grants" aria-labelledby="grants-title"></ul>
          <form id="grant-editor" autocomplete="off" hidden>
            <label for="grant-bot" id="grant-bot-label"></label>
            <select id="grant-bot" required></select>
            <label for="grant-service" id="grant-service-label"></label>
            <select id="grant-service" required></select>
            <label for="grant-name" id="grant-name-label"></label>
            <input id="grant-name" type="text" maxlength="64" pattern="[A-Za-z_][A-Za-z0-9_]{0,63}" spellcheck="false" required>
            <div id="grant-scope-field" hidden>
              <label for="grant-scope" id="grant-scope-label"></label>
              <select id="grant-scope" required></select>
            </div>
            <div class="actions">
              <button id="grant-editor-cancel" type="button"></button>
              <button id="grant-save" class="primary" type="submit"></button>
            </div>
          </form>
          <section id="browser-access" class="browser-access" aria-labelledby="browser-access-title" hidden>
            <div class="list-title">
              <h2 id="browser-access-title"></h2>
            </div>
            <p id="browser-access-hint" class="panel-hint"></p>
            <p id="browser-access-notice" role="status" aria-live="polite"></p>
            <p id="browser-access-empty" class="empty" hidden></p>
            <ul id="browser-access-list" aria-labelledby="browser-access-title"></ul>
          </section>
        </section>
        <section id="websites-panel" role="tabpanel" aria-labelledby="websites-tab" hidden>
          <p id="websites-hint" class="panel-hint"></p>
          <p id="websites-automatic-hint" class="panel-hint"></p>
          <p id="websites-automatic-notice" role="status" aria-live="polite" hidden></p>
          <div id="websites-notice" role="status" aria-live="polite"></div>
          <div class="list-title">
            <h2 id="logins-title"></h2>
            <div class="actions">
              <button id="import-logins" class="subtle" type="button" disabled></button>
              <button id="add-login" class="subtle" type="button">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11m-5.5-5.5h11"/></svg><span id="add-login-label"></span>
              </button>
            </div>
          </div>
          <p id="logins-empty" class="empty"></p>
          <ul id="logins" aria-labelledby="logins-title"></ul>
          <form id="login-editor" autocomplete="off" hidden>
            <h2 id="login-editor-title"></h2>
            <label for="login-origin" id="login-origin-label"></label>
            <input id="login-origin" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <label for="login-label" id="login-label-label"></label>
            <input id="login-label" type="text" maxlength="80" autocomplete="off" spellcheck="false" required>
            <div id="login-bot-field" hidden>
              <label for="login-bot" id="login-bot-label"></label>
              <select id="login-bot"></select>
            </div>
            <label for="login-username" id="login-username-label"></label>
            <input id="login-username" type="text" maxlength="512" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <label for="login-password" id="login-password-label"></label>
            <input id="login-password" type="password" maxlength="8192" autocomplete="new-password" autocapitalize="off" spellcheck="false" required>
            <div class="actions">
              <button id="login-editor-cancel" type="button"></button>
              <button id="login-save" class="primary" type="submit"></button>
            </div>
          </form>
        </section>
        <section id="api-keys-panel" role="tabpanel" aria-labelledby="api-keys-tab">
          <section id="services" hidden>
            <label for="service" id="service-label"></label>
            <select id="service"></select>
            <div class="list-title">
              <h2 id="names"></h2>
              <button id="add" class="subtle" type="button">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11m-5.5-5.5h11"/></svg><span id="add-label"></span>
              </button>
            </div>
            <p id="empty" class="empty"></p>
            <ul id="secrets" aria-labelledby="names"></ul>
            <form id="editor" autocomplete="off" hidden>
              <h2 id="editor-title"></h2>
              <label for="name" id="name-label"></label>
              <input id="name" type="text" maxlength="64" pattern="[A-Za-z_][A-Za-z0-9_]{0,63}" autocomplete="off" spellcheck="false" required>
              <label for="value" id="value-label"></label>
              <input id="value" type="password" maxlength="8192" autocomplete="new-password" autocapitalize="off" spellcheck="false" required>
              <div class="actions">
                <button id="editor-cancel" type="button"></button>
                <button id="save" class="primary" type="submit"></button>
              </div>
            </form>
          </section>
        </section>
      </div>
      <footer><p id="apply"></p><p id="grant-notice" role="status" aria-live="polite" hidden></p><button id="refresh" type="button"></button></footer>
    </main>
    <dialog id="confirmation" aria-labelledby="confirm-title" aria-describedby="confirm-detail">
      <h2 id="confirm-title"></h2>
      <p id="confirm-detail"></p>
      <div class="actions">
        <button id="confirm-cancel" type="button" autofocus></button>
        <button id="confirm-revoke" class="danger" type="button"></button>
      </div>
    </dialog>
    <dialog id="login-import" aria-labelledby="login-import-title" aria-describedby="login-import-detail login-import-notes">
      <h2 id="login-import-title"></h2>
      <p id="login-import-detail"></p>
      <ul id="login-import-list" aria-labelledby="login-import-title"></ul>
      <p id="login-import-notes"></p>
      <div class="actions">
        <button id="login-import-cancel" type="button" autofocus></button>
        <button id="login-import-save" class="primary" type="button"></button>
      </div>
    </dialog>
    <script src="cloud-vault.js"></script>
  </body>
</html>
