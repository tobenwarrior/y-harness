# Opt-in GitHub webhook overlay over the shipped Web composition. The second
# WebServer lives in an isolated realm so exposing it never exposes the UI API.

# Config patches replace the preset table, so keep the standard choices.
- id: permission
  config:
    defaultPreset: approve-for-me
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
        description: Ask before editing files outside the workspace or using the internet.
      approve-for-me:
        sandbox: workspace-write
        approval: never
        description: Work freely inside the workspace without prompts. Requests outside it are refused.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        description: Unrestricted access to the internet and any file on your computer.
      read-only:
        sandbox: read-only
        approval: ask

- insert:
    - id: webhook-runtime
      name: '@yharness/webhook'

    - id: github-ready-review-rule
      name: './github-ready-review-rule.mjs'
      config:
        source: primary-github
        repository: tobenwarrior/y-harness
        workspacePath: !!js process.env.DSH_GITHUB_REVIEW_WORKSPACE ?? process.cwd()
        agentPreset: standard
        permissionPreset: read-only

    - id: github-webhook-ingress
      name: cordis:group
      group: true
      isolate:
        webServer: true
      config:
        - id: github-webhook-server
          name: '@yharness/host-webserver'
          config:
            host: '127.0.0.1'
            port: !!js Number(process.env.DSH_GITHUB_WEBHOOK_PORT ?? 3081)

        - id: github-webhook-adapter
          name: '@yharness/webhook-github'
          config:
            source: primary-github
            path: /github
            secretEnv: DSH_GITHUB_WEBHOOK_SECRET
            maxBodyBytes: 1048576
